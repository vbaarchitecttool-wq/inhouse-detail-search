name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # error 0 件を維持する（warning は段階的解消のため許容）
      - name: Lint
        run: npm run lint

      # ユーティリティの単体テスト／原文インデックス・解説の整合性／アプリの煙テスト
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
