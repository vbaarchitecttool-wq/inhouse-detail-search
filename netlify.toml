[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 11.1.7の図解説明更新前に発行した写真URL
[[redirects]]
  from = "/diagrams/photo-d528e6b3.webp"
  to = "/diagrams/photo-9aee2b2c.webp"
  status = 301

# SPA（React）用: どのパスに来ても index.html を返す
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Corrected diagram photos keep stable filenames, so force browsers and the
# Service Worker to revalidate them instead of retaining an older replacement.
[[headers]]
  for = "/diagrams/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
